name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.0"
      - run: uv sync --frozen
      - name: Pruebas unitarias
        run: uv run pytest tests/unit
      - name: Cobertura (global >= 80 %, domain y security 100 %)
        # incluye integración (testcontainers usa el Docker del runner)
        run: |
          uv run pytest --cov=app --cov-report=xml
          uv run coverage report --include='app/domain/*,app/security/*' --fail-under=100
      - name: Análisis estático
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Build de la imagen Docker
        run: docker build .
      - name: SonarCloud
        # sin el secret SONAR_TOKEN el paso se omite
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
