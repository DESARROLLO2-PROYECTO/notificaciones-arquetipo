services:
  db:
    # [Archetype Convention Addition] PostgreSQL local en lugar de Neon: paridad dev/prod (12-factor X)
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - notif_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [notif_net]

  rabbitmq:
    # RabbitMQ local en lugar de CloudAMQP: misma versión mayor que el plan gratuito.
    # El usuario "guest" solo acepta conexiones desde localhost, por eso se define otro.
    image: rabbitmq:3.13.7-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      # Solo desde esta máquina: lo usa el demo (scripts/demo) para mirar las colas.
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - notif_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [notif_net]

  api:
    build: .
    env_file: .env
    ports:
      - "${API_PORT:-8090}:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [notif_net]

networks:
  notif_net:

volumes:
  notif_pgdata:
  notif_rabbitmq:
