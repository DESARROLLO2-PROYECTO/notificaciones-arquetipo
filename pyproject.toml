[project]
name = "notificaciones"
version = "0.1.0"
description = "Arquetipo mínimo transaccional: Equipo (Desarrollo II)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Aplicación, no librería: uv instala solo las dependencias.
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.16",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["app"]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
relative_files = true
branch = true

[tool.coverage.report]
# Global >= 80 %. Domain + schemas al 100 %:
#   coverage report --include='app/domain/*,app/api/schemas.py' --fail-under=100
fail_under = 80
show_missing = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas: api > infrastructure > domain"
type = "layers"
layers = ["app.api", "app.infrastructure", "app.domain"]

[[tool.importlinter.contracts]]
name = "El dominio no depende de frameworks"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "pydantic"]
